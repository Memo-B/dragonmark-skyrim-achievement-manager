name: Build and test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: ./scripts/Check-Repository.ps1
      - run: dotnet restore Dragonmark.sln --locked-mode
      - run: dotnet format Dragonmark.sln --verify-no-changes --no-restore
      - run: dotnet build Dragonmark.sln -c Release --no-restore
      - run: dotnet test Dragonmark.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: ./scripts/Check-Dependencies.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            TestResults/*.trx
            artifacts/dependency-audit.json
          retention-days: 14
