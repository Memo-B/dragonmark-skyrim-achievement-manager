name: Package Windows beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install pinned compiler and package declared prerelease
        shell: pwsh
        run: |
          $compiler = ./scripts/Setup-InstallerCompiler.ps1
          ./scripts/Package.ps1 -InstallerCompiler $compiler
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dragonmark-windows-x64-beta
          path: |
            artifacts/Dragonmark-v*.zip
            artifacts/Dragonmark-v*-Setup.exe
            artifacts/Dragonmark-v*.sha256
          if-no-files-found: error
          retention-days: 14
